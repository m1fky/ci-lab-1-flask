[tool:pytest]
# По умолчанию запускаются только Unit-тесты; интеграционные: pytest tests/integration
testpaths = tests/unit
pythonpath = .
# Quality Gate: pytest завершится с ненулевым кодом, если покрытие < 80%
addopts =
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=80

# app/visits.py работает с PostgreSQL и Redis и проверяется интеграционными тестами,
# поэтому порог покрытия Unit-тестов считается без него
[coverage:run]
omit = app/visits.py

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    htmlcov
