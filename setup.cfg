[tool:pytest]
testpaths = tests
pythonpath = .
# Quality Gate: pytest завершится с ненулевым кодом, если покрытие < 80%
addopts =
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=80

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    htmlcov
