name: CI

on:
  push:
    branches: [main]
    # Коммит job update-manifest меняет только манифест: новый запуск для него не нужен
    paths-ignore:
      - "k8s-manifests/**"
  pull_request:
    branches: [main]

# По умолчанию токен только читает; права на запись выдаются конкретным job
permissions:
  contents: read

env:
  # Версия Trivy закреплена явно (см. инцидент CVE-2026-33634)
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  # ---------- ЛР1: линтер, Unit-тесты с покрытием, проверка сборки ----------
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (with pip cache)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Unit tests with coverage (Quality Gate >= 80%)
        # порог --cov-fail-under=80 и исключение app/visits.py заданы в setup.cfg
        run: pytest tests/unit

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            rate=$(python -c "import xml.etree.ElementTree as E; print(round(float(E.parse('coverage.xml').getroot().get('line-rate'))*100, 2))")
            echo "### Покрытие Unit-тестами: ${rate}% (порог 80%)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build (syntax check + app import)
        run: |
          python -m compileall -q app run.py
          python -c "from app import create_app; create_app()"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # ---------- ЛР3: интеграционные тесты с Testcontainers ----------
  integration-tests:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      # job'ы не разделяют файловую систему: код и зависимости ставятся заново
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (with pip cache)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Integration tests (parallel, PostgreSQL + Redis in Testcontainers)
        run: |
          # журнал запуска и удаления контейнеров тестовой сессии
          docker events --filter type=container --filter label=org.testcontainers.session-id \
            --format '{{.Action}} {{index .Actor.Attributes "image"}} {{.Actor.ID}}' > tc-events.log &
          echo $! > tc-events.pid
          pytest tests/integration -n auto --no-cov -v --durations=0

      - name: Testcontainers cleanup check
        if: always()
        run: |
          sleep 2
          kill "$(cat tc-events.pid)" 2>/dev/null || true
          echo "События контейнеров тестовой сессии:"
          grep -E '^(start|destroy) ' tc-events.log | cut -c1-60 || true
          left=$(docker ps -aq --filter label=org.testcontainers.session-id | wc -l)
          echo "Контейнеров Testcontainers после завершения тестов: $left"
          echo "### Контейнеров Testcontainers после тестов: $left" >> "$GITHUB_STEP_SUMMARY"
          test "$left" -eq 0

  # ---------- ЛР2: сборка, сканирование и публикация образа ----------
  docker-image:
    needs: integration-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image name and tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image (no push) with layer cache
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container answers /health)
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE:$SHORT_SHA"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/health
          docker rm -f smoke

      - name: Trivy full report (all severities, never fails)
        if: always() && steps.build_image.outcome == 'success'
        run: |
          mkdir -p reports "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image \
              --format table \
              --output /reports/trivy-report.txt \
              --exit-code 0 \
              "$IMAGE:$SHORT_SHA"
          cat reports/trivy-report.txt

      - name: Generate SBOM (CycloneDX)
        if: always() && steps.build_image.outcome == 'success'
        run: |
          mkdir -p reports "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image \
              --format cyclonedx \
              --output /reports/sbom.cdx.json \
              "$IMAGE:$SHORT_SHA"

      - name: Trivy Quality Gate (HIGH/CRITICAL with available fix)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$IMAGE:$SHORT_SHA"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: reports/trivy-report.txt
          if-no-files-found: ignore

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom-cyclonedx
          path: reports/sbom.cdx.json
          if-no-files-found: ignore

      # публикация: только push в main и только после Quality Gate
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:build-${{ github.run_number }}"
          echo "### Опубликован образ: \`$IMAGE:$SHORT_SHA\` и \`$IMAGE:build-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------- ЛР3: продвижение образа в staging без пересборки ----------
  promote-to-staging:
    needs: docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Compute image names
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SRC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DST=ghcr.io/${GITHUB_REPOSITORY,,}-staging" >> "$GITHUB_ENV"

      - name: Log in to GHCR (skopeo)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy image to staging (no rebuild)
        run: skopeo copy --all --preserve-digests "docker://$SRC:$SHORT_SHA" "docker://$DST:$SHORT_SHA"

      - name: Verify staging image
        run: |
          skopeo inspect "docker://$DST:$SHORT_SHA" | jq '{Name, Digest, Created, Labels}'
          src=$(skopeo inspect --format '{{.Digest}}' "docker://$SRC:$SHORT_SHA")
          dst=$(skopeo inspect --format '{{.Digest}}' "docker://$DST:$SHORT_SHA")
          echo "dev:     $SRC:$SHORT_SHA  $src"
          echo "staging: $DST:$SHORT_SHA  $dst"
          test "$src" = "$dst"
          echo "### Продвинут в staging: \`$DST:$SHORT_SHA\` (digest совпадает с dev)" >> "$GITHUB_STEP_SUMMARY"

  # ---------- ЛР3: GitOps, обновление тега в манифесте staging ----------
  update-manifest:
    needs: promote-to-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # push выполняется через deploy key, а не через GITHUB_TOKEN
    steps:
      - name: Checkout (deploy key with write access)
        uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.MANIFEST_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Update image tag in staging manifest
        env:
          MANIFEST: k8s-manifests/staging/deployment.yaml
        run: |
          yq --version
          export NEW_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-staging:${GITHUB_SHA::7}"
          yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' "$MANIFEST"
          git diff -- "$MANIFEST"
          test "$(yq '.spec.template.spec.containers[0].image' "$MANIFEST")" = "$NEW_IMAGE"

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/staging/deployment.yaml
          if git diff --cached --quiet; then
            echo "Тег в манифесте уже актуален"
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7} to staging [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### Манифест staging обновлён: тег ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
