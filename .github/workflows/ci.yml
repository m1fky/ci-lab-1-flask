name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Права токена GITHUB_TOKEN: читать код и публиковать пакеты в GHCR
permissions:
  contents: read
  packages: write

env:
  # Версия Trivy закреплена явно (см. инцидент CVE-2026-33634)
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ---------- ЛР1: проверки кода ----------
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (with pip cache)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Tests with coverage (Quality Gate >= 80%)
        # параметры покрытия и порог --cov-fail-under=80 заданы в setup.cfg
        run: pytest

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            rate=$(python -c "import xml.etree.ElementTree as E; print(round(float(E.parse('coverage.xml').getroot().get('line-rate'))*100, 2))")
            echo "### Покрытие кода: ${rate}% (порог 80%)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build (syntax check + app import)
        run: |
          python -m compileall -q app run.py
          python -c "from app import create_app; create_app()"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      # ---------- ЛР2: Docker-образ ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image name and tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image (no push) with layer cache
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container answers /health)
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE:$SHORT_SHA"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://localhost:5000/health
          docker rm -f smoke

      - name: Trivy full report (all severities, never fails)
        if: always() && steps.build_image.outcome == 'success'
        run: |
          mkdir -p reports "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image \
              --format table \
              --output /reports/trivy-report.txt \
              --exit-code 0 \
              "$IMAGE:$SHORT_SHA"
          cat reports/trivy-report.txt

      - name: Generate SBOM (CycloneDX)
        if: always() && steps.build_image.outcome == 'success'
        run: |
          mkdir -p reports "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image \
              --format cyclonedx \
              --output /reports/sbom.cdx.json \
              "$IMAGE:$SHORT_SHA"

      - name: Trivy Quality Gate (HIGH/CRITICAL with available fix)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$IMAGE:$SHORT_SHA"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: reports/trivy-report.txt
          if-no-files-found: ignore

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom-cyclonedx
          path: reports/sbom.cdx.json
          if-no-files-found: ignore

      # ---------- Публикация: только push в main и только после Quality Gate ----------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:build-${{ github.run_number }}"
          echo "### Опубликован образ: \`$IMAGE:$SHORT_SHA\` и \`$IMAGE:build-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
