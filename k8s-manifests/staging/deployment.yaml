# Желаемое состояние staging-окружения (GitOps).
# Тег образа обновляет job update-manifest после продвижения образа в staging.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-lab-flask
  namespace: staging
  labels:
    app: ci-lab-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-lab-flask
  template:
    metadata:
      labels:
        app: ci-lab-flask
    spec:
      containers:
        - name: ci-lab-flask
          image: ghcr.io/m1fky/ci-lab-1-flask-staging:80381bd
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
