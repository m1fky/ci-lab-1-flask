# Указывает Prometheus, с каких Pod собирать метрики приложения.
# kube-prometheus-stack учитывает только мониторы с меткой release своего Helm-релиза.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: myapp
  namespace: staging
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector:
    matchLabels:
      app: myapp
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
