# Автоматическое решение о продолжении или откате по доле ответов 5xx
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-check
  namespace: staging
spec:
  metrics:
    - name: error-rate
      interval: 30s
      # порог 1%; NaN (нет трафика, знаменатель 0) тоже считается неудачей
      successCondition: result[0] < 0.01
      failureLimit: 1
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          # "or vector(0)": пока приложение не отдало ни одного 5xx, ряда с такими
          # кодами не существует, и без этой подстановки запрос вернул бы пустой результат
          query: |
            (sum(rate(http_requests_total{namespace="staging",status_code=~"5.."}[1m])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="staging"}[1m]))
